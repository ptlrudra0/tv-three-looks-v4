// Artistic mode: pitch-black background option.
// The wheel scene renders inside an open shadow root, so the black theme is a
// style element injected there and toggled by a class on the shadow host.
// Cream stays the default; the choice persists on this device.
(function(){
  var KEY='tv-art-bg';
  var enabled=false;
  try{enabled=localStorage.getItem(KEY)==='black';}catch(e){}
  var BLACK_CSS=[
    '.stage{background:#000;color:#f4f2ec}',
    '.mast .brand .meta,.mast .mid,.ctl,.title,.metaRow .col .val,.foot .nav span,.foot .open{color:#f4f2ec}',
    '.mast .mid .sec.dim,.metaRow .col .lbl,.metaRow .no .of,.foot .nav span .lbl{color:#a39c90}',
    '.ctl.f{background:#f4f2ec;color:#000}',
    '.panel,.panel.drow,.gtile{background:#191512}',
    '.panel.f{outline-color:#f4f2ec;box-shadow:0 18px 50px rgba(0,0,0,.6)}',
    '.gtile.f{outline-color:#f4f2ec}',
    '.panel.sliced.f .stripinner::after{border-color:#f4f2ec}'
  ].join('\n');
  var pill=null;
  function ensurePill(){
    if(pill)return pill;
    pill=document.createElement('button');
    pill.id='art-bg-pill';
    pill.type='button';
    pill.hidden=true;
    pill.setAttribute('aria-pressed','false');
    pill.setAttribute('aria-label','Toggle pitch-black background in Artistic mode');
    pill.innerHTML='<span class="ab-dot"></span><span class="ab-state">Cream</span><span class="ab-key">B</span>';
    pill.addEventListener('click',toggle);
    document.body.appendChild(pill);
    return pill;
  }
  function wheelHost(){
    var shell=document.querySelector('.shell.mode-wheel');
    if(!shell)return null;
    for(var i=0;i<shell.children.length;i++){if(shell.children[i].shadowRoot)return shell.children[i];}
    return null;
  }
  function apply(){
    ensurePill();
    var host=wheelHost();
    if(!host){pill.hidden=true;return;}
    pill.hidden=false;
    var st=host.shadowRoot.querySelector('#art-black-style');
    if(!st){
      st=document.createElement('style');
      st.id='art-black-style';
      host.shadowRoot.appendChild(st);
    }
    var css=enabled?BLACK_CSS:'';
    if(st.textContent!==css)st.textContent=css;
    host.classList.toggle('art-black',enabled);
    pill.classList.toggle('on-black',enabled);
    pill.setAttribute('aria-pressed',enabled?'true':'false');
    pill.querySelector('.ab-state').textContent=enabled?'Background \u00b7 Black':'Background \u00b7 Cream';
  }
  function toggle(){
    enabled=!enabled;
    try{localStorage.setItem(KEY,enabled?'black':'cream');}catch(e){}
    apply();
  }
  window.addEventListener('keydown',function(e){
    if(e.key!=='b'&&e.key!=='B')return;
    if(!document.querySelector('.shell.mode-wheel'))return;
    if(document.querySelector('.switcher'))return;
    e.preventDefault();
    e.stopImmediatePropagation();
    toggle();
  },true);
  var root=document.getElementById('root');
  if(root)new MutationObserver(apply).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  setTimeout(apply,400);
  setTimeout(apply,1500);
})();
